<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

    <title>Manager Panel - FindMyThing</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/navbar.css">

    <style>
        /* ================= GLOBAL ================= */

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #2c3e50;
            color: white;
            flex-wrap: wrap;
        }

        .navbar h2 {
            margin: 5px 0;
        }

        .nav-links a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
            font-weight: 500;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        /* ================= TITLE ================= */

        h1 {
            text-align: center;
            margin: 20px 0;
        }

        /* ================= TABLE ================= */

        .table-container {
            width: 95%;
            margin: 20px auto;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        th {
            background: #34495e;
            color: white;
            padding: 12px;
            position: sticky;
            top: 0;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #eee;
            text-align: center;
        }

        tr:hover {
            background: #f9f9f9;
        }

        /* ================= BUTTON ================= */

        .collect-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        .collect-btn:hover {
            background: #1e8449;
        }

        /* ================= IMAGE ================= */

        .table-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid #ddd;
            display: block;
            margin: auto;
        }

        .table-img:hover {
            transform: scale(1.1);
        }

        /* Image loading error */

        .image-error {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            border: 1px solid #ddd;
            border-radius: 6px;
            color: #999;
            font-size: 12px;
            background: #f5f5f5;
        }

        /* ================= EMAIL ================= */

        .email-link {
            color: #2980b9;
            text-decoration: none;
        }

        .email-link:hover {
            text-decoration: underline;
        }

        /* ================= MODAL ================= */

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal img {
            max-width: 85%;
            max-height: 85%;
            border-radius: 10px;
        }

        /* ================= GOOGLE ================= */

        #google_translate_element {
            margin-right: 10px;
        }

        .goog-te-combo {
            padding: 5px;
            border-radius: 5px;
            border: none;
        }

        /* ================= MOBILE ================= */

        @media(max-width:768px) {

            .navbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .nav-links {
                margin-top: 10px;
            }

            .table-container {
                width: 98%;
            }

            table {
                font-size: 13px;
            }

            th,
            td {
                padding: 8px;
            }

        }
    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar" id="mainNavbar"></nav>


    <!-- ================= TITLE ================= -->

    <h1>Manage & Verify Items</h1>


    <!-- ================= TABLE ================= -->

    <div class="table-container">

        <table>

            <thead>

                <tr id="tableHead">
                    <!-- Dynamic headers -->
                </tr>

            </thead>

            <tbody id="itemsTable">
                <!-- Dynamic items -->
            </tbody>

        </table>

    </div>


    <!-- ================= IMAGE MODAL ================= -->

    <div id="imageModal" class="modal" onclick="closeImage()">

        <img id="modalImage" alt="Item Image">

    </div>



    <script>

        /* =========================================================
           HELPERS
        ========================================================= */

        function safe(val) {

            if (
                val === null ||
                val === undefined ||
                val === ""
            ) {
                return "N/A";
            }

            return val;

        }


        /* =========================================================
           IMAGE URL HANDLER
        ========================================================= */

        function getImageUrl(image) {

            if (!image) {
                return "";
            }

            image = String(image).trim();

            if (!image) {
                return "";
            }


            /*
             * NEW CLOUDINARY IMAGE
             *
             * Example:
             * https://res.cloudinary.com/xxxxx/image/upload/xxxxx.jpg
             *
             * Use it directly.
             */

            if (
                image.startsWith("https://") ||
                image.startsWith("http://")
            ) {

                return image;

            }


            /*
             * OLD LOCAL UPLOAD
             *
             * This keeps old images working if
             * your database still contains filenames.
             */

            if (image.startsWith("/uploads/")) {

                return image;

            }

            return "/uploads/" + encodeURIComponent(image);

        }


        /* =========================================================
           IMAGE ERROR HANDLER
        ========================================================= */

        function imageLoadError(img) {

            console.error(
                "Image failed to load:",
                img.src
            );

            const errorBox = document.createElement("div");

            errorBox.className = "image-error";

            errorBox.textContent = "No Image";

            img.replaceWith(errorBox);

        }


        /* =========================================================
           LOAD ITEMS
        ========================================================= */

        async function loadItems() {

            try {

                const res = await fetch("/api/items", {
                    credentials: "include"
                });


                if (!res.ok) {

                    throw new Error(
                        "Failed to fetch items. Status: " +
                        res.status
                    );

                }


                const data = await res.json();


                console.log("Manager items:", data);


                /*
                 * Check whether any item contains
                 * handedBy or handedTo.
                 */

                const showHandover =
                    data.some(
                        item =>
                            item.handedBy ||
                            item.handedTo
                    );


                /* =================================================
                   TABLE HEADER
                ================================================= */

                document.getElementById("tableHead").innerHTML =
                    showHandover

                        ?

                        `

            <th>Name</th>

            <th>Type</th>

            <th>Description</th>

            <th>Original Location</th>

            <th>Submit Location</th>

            <th>Date</th>

            <th>Submitted By</th>

            <th>Email</th>

            <th>Handed By</th>

            <th>Handed To</th>

            <th>Image</th>

            <th>Action</th>

            `

                        :

                        `

            <th>Name</th>

            <th>Type</th>

            <th>Description</th>

            <th>Original Location</th>

            <th>Submit Location</th>

            <th>Date</th>

            <th>Submitted By</th>

            <th>Email</th>

            <th>Image</th>

            <th>Action</th>

            `;


                /* =================================================
                   TABLE ROWS
                ================================================= */

                let html = "";


                data.forEach(item => {


                    const originalLocation =
                        item.lostLocation ||
                        item.foundLocation;


                    /* =============================================
                       IMAGE
                    ============================================= */

                    let imageHTML = "No Image";


                    if (item.image) {

                        const imageUrl =
                            getImageUrl(item.image);


                        imageHTML = `

                    <img

                        class="table-img"

                        src="${imageUrl}"

                        alt="${safe(item.name)}"

                        loading="lazy"

                        onclick="showImage('${imageUrl.replace(/'/g, "\\'")}')"

                        onerror="imageLoadError(this)"

                    >

                `;

                    }


                    /* =============================================
                       HANDOVER
                    ============================================= */

                    const handoverHTML =
                        showHandover

                            ?

                            `

                <td>
                    ${safe(item.handedBy)}
                </td>

                <td>
                    ${safe(item.handedTo)}
                </td>

                `

                            :

                            "";


                    /* =============================================
                       ROW
                    ============================================= */

                    html += `

            <tr>


                <td>
                    ${safe(item.name)}
                </td>


                <td>
                    ${safe(item.type)}
                </td>


                <td>
                    ${safe(item.description)}
                </td>


                <td>
                    ${safe(originalLocation)}
                </td>


                <td>
                    ${safe(item.location)}
                </td>


                <td>
                    ${safe(
                        item.dateLost ||
                        item.dateFound
                    )}
                </td>


                <td>
                    ${safe(item.userName)}
                </td>


                <td>

                    <a

                        class="email-link"

                        href="mailto:${safe(item.userEmail)}"

                    >

                        ${safe(item.userEmail)}

                    </a>

                </td>


                ${handoverHTML}


                <td>

                    ${imageHTML}

                </td>


                <td>

                    <form

                        action="/mark-collected"

                        method="POST"

                        onsubmit="return confirm('Confirm item collection?')"

                    >

                        <input

                            type="hidden"

                            name="itemId"

                            value="${item._id}"

                        >


                        <button

                            type="submit"

                            class="collect-btn"

                        >

                            Collected

                        </button>

                    </form>

                </td>


            </tr>

            `;

                });


                document.getElementById(
                    "itemsTable"
                ).innerHTML = html;


            }

            catch (err) {

                console.error(
                    "Error loading manager items:",
                    err
                );

                document.getElementById(
                    "itemsTable"
                ).innerHTML = `

            <tr>

                <td
                    colspan="12"
                    style="padding:30px;color:red;"
                >

                    Failed to load items.

                </td>

            </tr>

        `;

            }

        }


        /* =========================================================
           IMAGE MODAL
        ========================================================= */

        function showImage(src) {

            if (!src) {
                return;
            }


            const modal =
                document.getElementById(
                    "imageModal"
                );


            const image =
                document.getElementById(
                    "modalImage"
                );


            image.src = src;

            modal.style.display = "flex";

        }


        /* =========================================================
           CLOSE IMAGE MODAL
        ========================================================= */

        function closeImage() {

            const modal =
                document.getElementById(
                    "imageModal"
                );


            const image =
                document.getElementById(
                    "modalImage"
                );


            modal.style.display = "none";

            image.src = "";

        }


        /* =========================================================
           ESC KEY TO CLOSE IMAGE
        ========================================================= */

        document.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Escape") {

                    closeImage();

                }

            }
        );


        /* =========================================================
           INITIALIZE
        ========================================================= */

        loadItems();

    </script>


    <!-- ================= NAVBAR ================= -->

    <script src="/js/navbar.js"></script>

    <script src="/js/translate.js"></script>

    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit">
    </script>


</body>

</html>
