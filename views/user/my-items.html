<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <title>My Items — FindMyThing</title>

  <link rel="stylesheet" href="/css/navbar.css">

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --navy: #1a2744;
      --navy2: #243058;
      --gold: #c9a84c;
      --gold2: #e8c97a;

      --cream: #faf7f0;
      --white: #ffffff;

      --muted: #6b7280;
      --border: #e2e8f0;

      --lost: #e74c3c;
      --lost-bg: #fef2f0;

      --found: #2980b9;
      --found-bg: #eef6fc;

      --green: #1a6b3a;
      --green-bg: #ecfdf5;

      --amber: #d97706;
      --amber-bg: #fffbeb;

      --shadow: 0 4px 24px rgba(26, 39, 68, 0.10);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: var(--cream);
      color: var(--navy);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ================= BACKGROUND ================= */

    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-layer::before {
      content: "";
      position: absolute;
      inset: 0;

      background:
        radial-gradient(ellipse 80% 60% at 5% 10%,
          rgba(201, 168, 76, 0.07) 0%,
          transparent 55%),
        radial-gradient(ellipse 60% 70% at 95% 90%,
          rgba(26, 39, 68, 0.05) 0%,
          transparent 55%);
    }

    .bg-dots {
      position: absolute;
      inset: 0;

      background-image:
        radial-gradient(circle,
          rgba(201, 168, 76, 0.11) 1px,
          transparent 1px);

      background-size: 38px 38px;
    }

    .bg-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(201, 168, 76, 0.09);
    }

    .br1 {
      width: 640px;
      height: 640px;
      top: -220px;
      right: -160px;
    }

    .br2 {
      width: 440px;
      height: 440px;
      bottom: 0;
      left: -130px;
    }

    /* ================= NAVBAR ================= */

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;

      background: rgba(26, 39, 68, 0.97);

      backdrop-filter: blur(14px);

      border-bottom: 1px solid rgba(201, 168, 76, 0.25);

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 36px;

      min-height: 64px;
    }

    .nav-left {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .nav-brand {
      font-family: "Playfair Display", serif;
      font-size: 18px;
      font-weight: 700;
      color: white;
    }

    .nav-brand span {
      color: var(--gold);
    }

    .nav-brand-sub {
      font-size: 11px;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .nav-links a {
      color: rgba(255, 255, 255, 0.72);
      text-decoration: none;

      font-size: 13px;

      padding: 7px 14px;

      border-radius: 7px;

      transition: 0.2s;
    }

    .nav-links a:hover {
      color: var(--gold2);
      background: rgba(201, 168, 76, 0.07);
    }

    .nav-links a.active {
      background: var(--gold);
      color: var(--navy);
      font-weight: 600;
    }

    .role-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;

      border: 1px solid rgba(201, 168, 76, 0.35);

      font-size: 11px;
      font-weight: 600;

      padding: 5px 12px;

      border-radius: 100px;

      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .role-badge.user {
      background: rgba(41, 128, 185, 0.15);
      color: #7fb3d3;
    }

    .role-badge.manager {
      background: rgba(201, 168, 76, 0.15);
      color: var(--gold2);
    }

    .role-badge.admin {
      background: rgba(231, 76, 60, 0.15);
      color: #f1948a;
    }

    .rbadge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    /* ================= PAGE ================= */

    .page {
      position: relative;
      z-index: 1;

      padding: 36px 40px 60px;

      max-width: 1500px;

      margin: auto;
    }

    /* ================= HEADER ================= */

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      flex-wrap: wrap;

      gap: 20px;

      margin-bottom: 28px;
    }

    .breadcrumb {
      font-size: 12px;
      color: var(--muted);

      margin-bottom: 8px;

      display: flex;
      gap: 6px;
    }

    .breadcrumb a {
      color: var(--gold);
      text-decoration: none;
    }

    .page-header h1 {
      font-family: "Playfair Display", serif;

      font-size: 28px;

      color: var(--navy);
    }

    .page-header p {
      font-size: 13.5px;

      color: var(--muted);

      margin-top: 5px;

      max-width: 600px;
    }

    /* ================= STATS ================= */

    .header-stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .hstat {
      background: white;

      border: 1px solid var(--border);

      border-radius: 12px;

      padding: 12px 22px;

      text-align: center;

      box-shadow: 0 2px 12px rgba(26, 39, 68, 0.06);

      min-width: 95px;
    }

    .hstat .snum {
      display: block;

      font-family: "Playfair Display", serif;

      font-size: 24px;

      font-weight: 700;
    }

    .hstat .slbl {
      display: block;

      font-size: 11px;

      color: var(--muted);

      text-transform: uppercase;

      letter-spacing: 1px;
    }

    .s-total .snum {
      color: var(--navy);
    }

    .s-lost .snum {
      color: var(--lost);
    }

    .s-found .snum {
      color: var(--found);
    }

    .s-pending .snum {
      color: var(--amber);
    }

    .s-collected .snum {
      color: var(--green);
    }

    /* ================= NOTICE ================= */

    .info-notice,
    .policy-notice {
      border-radius: 12px;

      padding: 13px 20px;

      margin-bottom: 24px;

      display: flex;

      gap: 12px;

      align-items: flex-start;
    }

    .info-notice {
      background: rgba(41, 128, 185, 0.07);

      border: 1px solid rgba(41, 128, 185, 0.25);

      border-left: 4px solid var(--found);
    }

    .policy-notice {
      background: rgba(201, 168, 76, 0.09);

      border: 1px solid rgba(201, 168, 76, 0.3);

      border-left: 4px solid var(--gold);
    }

    .info-notice-text,
    .policy-notice-text {
      font-size: 13px;

      line-height: 1.6;
    }

    /* ================= FILTERS ================= */

    .filters-card {
      background: white;

      border: 1px solid var(--border);

      border-radius: 16px;

      padding: 22px 26px;

      margin-bottom: 24px;

      box-shadow: var(--shadow);
    }

    .filters-label {
      font-size: 11px;

      font-weight: 700;

      letter-spacing: 1.5px;

      text-transform: uppercase;

      color: var(--muted);

      margin-bottom: 14px;
    }

    .filters-row {
      display: flex;

      flex-wrap: wrap;

      gap: 12px;

      align-items: flex-end;
    }

    .filter-group {
      display: flex;

      flex-direction: column;

      gap: 5px;

      flex: 1;

      min-width: 150px;
    }

    .filter-group label {
      font-size: 11.5px;

      font-weight: 600;

      color: var(--navy);

      text-transform: uppercase;
    }

    .filter-group input,
    .filter-group select {
      padding: 9px 13px;

      border: 1.5px solid var(--border);

      border-radius: 9px;

      font-family: "DM Sans", sans-serif;

      font-size: 13.5px;

      color: var(--navy);

      background: #f8fafc;

      outline: none;
    }

    .filter-group input:focus,
    .filter-group select:focus {
      border-color: var(--navy);

      background: white;
    }

    .btn-reset {
      padding: 9px 20px;

      background: transparent;

      border: 1.5px solid var(--border);

      border-radius: 9px;

      cursor: pointer;

      color: var(--muted);

      font-family: "DM Sans", sans-serif;
    }

    .btn-reset:hover {
      border-color: var(--navy);
      color: var(--navy);
    }

    .active-filters {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      margin-top: 12px;
    }

    .filter-pill {
      background: rgba(201, 168, 76, 0.1);

      border: 1px solid rgba(201, 168, 76, 0.3);

      border-radius: 100px;

      padding: 4px 12px;

      font-size: 12px;

      color: #8a6b1e;
    }

    .filter-pill button {
      background: none;

      border: none;

      cursor: pointer;

      color: #8a6b1e;
    }

    /* ================= TABS ================= */

    .tab-bar {
      display: flex;

      background: white;

      border: 1px solid var(--border);

      border-radius: 14px;

      padding: 5px;

      margin-bottom: 24px;

      box-shadow: 0 2px 12px rgba(26, 39, 68, 0.06);

      width: fit-content;

      flex-wrap: wrap;
    }

    .tab-btn {
      display: flex;

      align-items: center;

      gap: 8px;

      padding: 10px 24px;

      border: none;

      border-radius: 10px;

      background: transparent;

      color: var(--muted);

      cursor: pointer;

      font-family: "DM Sans", sans-serif;

      font-size: 13.5px;
    }

    .tab-btn.active-all {
      background: var(--navy);
      color: white;
    }

    .tab-btn.active-lost {
      background: var(--lost);
      color: white;
    }

    .tab-btn.active-found {
      background: var(--found);
      color: white;
    }

    .tab-btn.active-pending {
      background: var(--amber);
      color: white;
    }

    .tab-btn.active-collected {
      background: var(--green);
      color: white;
    }

    .tab-count {
      padding: 2px 8px;

      border-radius: 100px;

      background: rgba(255, 255, 255, 0.25);

      font-size: 11px;
    }

    /* ================= TABLE ================= */

    .table-section-title {
      display: flex;

      align-items: center;

      gap: 12px;

      margin-bottom: 14px;
    }

    .tsect-icon {
      width: 36px;

      height: 36px;

      border-radius: 10px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 16px;
    }

    .i-all {
      background: rgba(26, 39, 68, 0.08);
    }

    .i-lost {
      background: rgba(231, 76, 60, 0.1);
    }

    .i-found {
      background: rgba(41, 128, 185, 0.1);
    }

    .i-pending {
      background: rgba(217, 119, 6, 0.1);
    }

    .i-collected {
      background: rgba(26, 107, 58, 0.1);
    }

    .tsect-title {
      font-family: "Playfair Display", serif;

      font-size: 20px;

      font-weight: 600;
    }

    .tsect-sub {
      font-size: 12px;

      color: var(--muted);
    }

    .table-card {
      background: white;

      border-radius: 16px;

      box-shadow: var(--shadow);

      border: 1px solid var(--border);

      overflow: hidden;

      margin-bottom: 36px;
    }

    .c-all {
      border-top: 3px solid var(--gold);
    }

    .c-lost {
      border-top: 3px solid var(--lost);
    }

    .c-found {
      border-top: 3px solid var(--found);
    }

    .c-pending {
      border-top: 3px solid var(--amber);
    }

    .c-collected {
      border-top: 3px solid var(--green);
    }

    .table-scroll {
      overflow-x: auto;
    }

    table {
      width: 100%;

      border-collapse: collapse;

      font-size: 13px;
    }

    thead th {
      background: #f8fafc;

      color: var(--navy);

      padding: 11px 14px;

      font-size: 11px;

      text-transform: uppercase;

      border-bottom: 1px solid var(--border);

      white-space: nowrap;

      cursor: pointer;
    }

    tbody td {
      padding: 11px 14px;

      border-bottom: 1px solid #f0f3f8;

      color: var(--navy);

      vertical-align: middle;

      text-align: center;
    }

    tbody tr:hover {
      background: #f8fafd;
    }

    .count-bar {
      padding: 11px 20px;

      background: #f8fafc;

      border-top: 1px solid var(--border);

      font-size: 12px;

      color: var(--muted);

      display: flex;

      justify-content: space-between;
    }

    /* ================= BADGES ================= */

    .badge {
      display: inline-flex;

      align-items: center;

      gap: 5px;

      padding: 4px 10px;

      border-radius: 100px;

      font-size: 11px;

      font-weight: 600;
    }

    .badge-lost {
      background: var(--lost-bg);

      color: #c0392b;

      border: 1px solid rgba(231, 76, 60, 0.2);
    }

    .badge-found {
      background: var(--found-bg);

      color: #1a6fa8;

      border: 1px solid rgba(41, 128, 185, 0.2);
    }

    .badge-pending {
      background: var(--amber-bg);

      color: var(--amber);

      border: 1px solid rgba(217, 119, 6, 0.2);
    }

    .badge-collected {
      background: var(--green-bg);

      color: var(--green);

      border: 1px solid rgba(26, 107, 58, 0.2);
    }

    /* ============================================================
   IMPORTANT IMAGE CSS
   ============================================================ */

    .image-cell {
      width: 90px;
    }

    .table-img {
      width: 58px;

      height: 58px;

      display: block;

      margin: auto;

      object-fit: cover;

      border-radius: 10px;

      border: 2px solid var(--border);

      background: #f1f5f9;

      cursor: pointer;

      transition: 0.2s;
    }

    .table-img:hover {
      transform: scale(1.12);

      border-color: var(--gold);

      box-shadow: 0 5px 18px rgba(201, 168, 76, 0.3);
    }

    .image-loading {
      width: 58px;

      height: 58px;

      margin: auto;

      border-radius: 10px;

      background: #f1f5f9;

      border: 1px dashed var(--border);

      display: flex;

      align-items: center;

      justify-content: center;

      color: #94a3b8;

      font-size: 11px;
    }

    .no-img {
      width: 58px;

      height: 58px;

      margin: auto;

      border-radius: 10px;

      background: #f1f5f9;

      border: 1px dashed var(--border);

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 20px;

      color: #94a3b8;
    }

    /* ================= DETAIL ================= */

    .detail-row {
      display: none;
    }

    .detail-row.open {
      display: table-row;
    }

    .detail-row td {
      background: #f8fafc;

      padding: 18px;

      text-align: left;
    }

    .detail-grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(200px, 1fr));

      gap: 14px;
    }

    .detail-field label {
      display: block;

      font-size: 10.5px;

      font-weight: 700;

      text-transform: uppercase;

      color: var(--muted);

      margin-bottom: 3px;
    }

    .detail-field span {
      font-size: 13px;

      color: var(--navy);
    }

    /* ================= MODAL ================= */

    .modal {
      display: none;

      position: fixed;

      inset: 0;

      background: rgba(0, 0, 0, 0.88);

      z-index: 9999;

      align-items: center;

      justify-content: center;

      padding: 25px;
    }

    .modal.open {
      display: flex;
    }

    .modal-inner {
      position: relative;

      max-width: 750px;

      width: 100%;

      background: white;

      border-radius: 18px;

      overflow: hidden;
    }

    .modal-img-wrap {
      background: #080c14;

      padding: 20px;

      text-align: center;
    }

    .modal-img-wrap img {
      max-width: 100%;

      max-height: 500px;

      object-fit: contain;

      display: block;

      margin: auto;

      border-radius: 10px;
    }

    .modal-info {
      padding: 18px 24px;
    }

    .modal-item-name {
      font-family: "Playfair Display", serif;

      font-size: 21px;

      font-weight: 700;
    }

    .modal-item-desc {
      color: var(--muted);

      margin-top: 5px;

      font-size: 13px;
    }

    .modal-close {
      position: absolute;

      right: 15px;

      top: 15px;

      z-index: 2;

      width: 35px;

      height: 35px;

      border-radius: 50%;

      border: none;

      background: rgba(0, 0, 0, 0.6);

      color: white;

      cursor: pointer;

      font-size: 18px;
    }

    /* ================= EMPTY ================= */

    .empty-state {
      padding: 45px 20px;

      text-align: center;

      color: var(--muted);
    }

    .empty-state-icon {
      font-size: 38px;

      margin-bottom: 10px;
    }

    /* ================= RESPONSIVE ================= */

    @media(max-width: 900px) {
      .navbar {
        padding: 0 14px;
      }

      .nav-links {
        display: none;
      }

      .page {
        padding: 16px 12px 36px;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
      }

      .filters-row {
        flex-direction: column;
        width: 100%;
      }

      .filter-group {
        width: 100%;
        min-width: 0;
      }

      .filter-group input,
      .filter-group select {
        font-size: 16px; /* Android zoom prevention */
        min-height: 48px;
        width: 100%;
      }

      .header-stats {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .hstat {
        flex: 1;
        min-width: 0;
        padding: 10px 14px;
      }

      .tab-bar {
        width: 100%;
        overflow-x: auto;
        padding: 4px;
        display: flex;
        gap: 6px;
      }

      .tab-btn {
        padding: 9px 12px;
        font-size: 13px;
        white-space: nowrap;
        flex: 1;
        justify-content: center;
      }

      .modal {
        padding: 12px;
      }

      .modal-inner {
        width: 100%;
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="bg-layer">
    <div class="bg-dots"></div>
    <div class="bg-ring br1"></div>
    <div class="bg-ring br2"></div>
  </div>


  <!-- ============================================================
     NAVBAR
     ============================================================ -->

  <nav class="navbar" id="mainNavbar"></nav>


  <!-- ============================================================
     PAGE
     ============================================================ -->

  <div class="page">


    <!-- HEADER -->

    <div class="page-header">

      <div class="page-header-left">

        <div class="breadcrumb">

          <a href="/">
            Portal Home
          </a>

          <span>›</span>

          <span>
            My Items
          </span>

        </div>


        <h1>
          My Reported Items
        </h1>


        <p>
          View and track all lost and found items reported by you.
        </p>

      </div>


      <div class="header-stats">

        <div class="hstat s-total">
          <span class="snum" id="statTotal">0</span>
          <span class="slbl">Total</span>
        </div>

        <div class="hstat s-lost">
          <span class="snum" id="statLost">0</span>
          <span class="slbl">Lost</span>
        </div>

        <div class="hstat s-found">
          <span class="snum" id="statFound">0</span>
          <span class="slbl">Found</span>
        </div>

        <div class="hstat s-pending">
          <span class="snum" id="statPending">0</span>
          <span class="slbl">Pending</span>
        </div>

        <div class="hstat s-collected">
          <span class="snum" id="statCollected">0</span>
          <span class="slbl">Collected</span>
        </div>

      </div>

    </div>


    <!-- NOTICE -->

    <div id="noticeBox"></div>


    <!-- ========================================================
         FILTERS
         ======================================================== -->

    <div class="filters-card">

      <div class="filters-label">
        Search & Filter
      </div>


      <div class="filters-row">

        <div class="filter-group" style="flex:2;">

          <label>
            Search Name / Description
          </label>

          <input type="text" id="fSearch" placeholder="e.g. Samsung phone, black wallet...">

        </div>


        <div class="filter-group">

          <label>
            Item Type
          </label>

          <select id="fType">

            <option value="">
              All Types
            </option>

          </select>

        </div>


        <div class="filter-group">

          <label>
            Report Type
          </label>

          <select id="fReport">

            <option value="">
              All
            </option>

            <option value="lost">
              Lost
            </option>

            <option value="found">
              Found
            </option>

          </select>

        </div>


        <div class="filter-group">

          <label>
            Collection Status
          </label>

          <select id="fCollect">

            <option value="">
              All Statuses
            </option>

            <option value="pending">
              Pending
            </option>

            <option value="collected">
              Collected
            </option>

          </select>

        </div>


        <div class="filter-group">

          <label>
            Date From
          </label>

          <input type="date" id="fDateFrom">

        </div>


        <div class="filter-group">

          <label>
            Date To
          </label>

          <input type="date" id="fDateTo">

        </div>


        <div>

          <button class="btn-reset" id="btnReset">
            ✕ Reset
          </button>

        </div>

      </div>


      <div class="active-filters" id="activePills"></div>

    </div>


    <!-- ========================================================
         TABS
         ======================================================== -->

    <div class="tab-bar">

      <button class="tab-btn active-all" id="tabAll" onclick="setTab('all')">
        📋 All

        <span class="tab-count" id="tc-all">
          0
        </span>

      </button>


      <button class="tab-btn" id="tabLost" onclick="setTab('lost')">
        😞 Lost

        <span class="tab-count" id="tc-lost">
          0
        </span>

      </button>


      <button class="tab-btn" id="tabFound" onclick="setTab('found')">
        😀 Found

        <span class="tab-count" id="tc-found">
          0
        </span>

      </button>


      <button class="tab-btn" id="tabPending" onclick="setTab('pending')">
        ⏳ Pending

        <span class="tab-count" id="tc-pending">
          0
        </span>

      </button>


      <button class="tab-btn" id="tabCollected" onclick="setTab('collected')">
        ✅ Collected

        <span class="tab-count" id="tc-collected">
          0
        </span>

      </button>

    </div>


    <!-- ========================================================
         TABLE
         ======================================================== -->

    <div class="table-section">

      <div class="table-section-title">

        <div class="tsect-icon i-all">
          📋
        </div>

        <div>

          <div class="tsect-title">
            My Items
          </div>

          <div class="tsect-sub">
            Lost and found items reported by you
          </div>

        </div>

      </div>


      <div class="table-card c-all">

        <div class="table-scroll">

          <table>

            <thead>

              <tr id="tableHead"></tr>

            </thead>

            <tbody id="tableBody"></tbody>

          </table>

        </div>


        <div class="count-bar">

          <span>
            Showing
            <strong id="itemCount">0</strong>
            items
          </span>

          <span>
            Click a row to expand
          </span>

        </div>

      </div>

    </div>

  </div>


  <!-- ============================================================
     IMAGE MODAL
     ============================================================ -->

  <div class="modal" id="imgModal" onclick="closeImageModal(event)">

    <div class="modal-inner" onclick="event.stopPropagation()">

      <button class="modal-close" onclick="closeImageModal()">
        ✕
      </button>


      <div class="modal-img-wrap">

        <img id="modalImage" src="" alt="Item Image">

      </div>


      <div class="modal-info">

        <div class="modal-item-name" id="modalName"></div>

        <div class="modal-item-desc" id="modalDescription"></div>

      </div>

    </div>

  </div>


  <script>

    /* ============================================================
       GLOBAL VARIABLES
       ============================================================ */

    let allItems = [];

    let filteredItems = [];

    let currentTab = "all";

    let currentRole = "user";

    let expandedRow = null;

    let sortColumn = "";

    let sortDirection = 1;


    /* ============================================================
       BASIC HELPERS
       ============================================================ */

    function byId(id) {
      return document.getElementById(id);
    }


    function safe(value) {

      if (
        value === undefined ||
        value === null ||
        String(value).trim() === ""
      ) {
        return "N/A";
      }

      return String(value).trim();
    }


    function isLost(item) {

      return (
        item.type === "lost" ||
        !!item.lostLocation
      );

    }


    function isCollected(item) {

      /*
         Your backend currently returns normal Item
         documents from /api/my-items.
  
         If status is "Collected", consider it collected.
      */

      return (
        item.collected === true ||
        item.status === "Collected" ||
        item.status === "collected"
      );

    }


    function getDate(item) {

      return (
        item.dateLost ||
        item.dateFound ||
        ""
      );

    }


    /* ============================================================
       IMPORTANT CLOUDINARY IMAGE FUNCTION
       ============================================================ */

    function getImageUrl(item) {

      if (!item) {
        return "";
      }


      /*
         Support different possible image field formats.
      */

      let image =
        item.image ??
        item.imageUrl ??
        item.secure_url ??
        item.secureUrl ??
        "";


      /*
         If image somehow comes as an object.
      */

      if (
        typeof image === "object" &&
        image !== null
      ) {

        image =
          image.secure_url ||
          image.secureUrl ||
          image.url ||
          image.path ||
          "";

      }


      if (!image) {
        return "";
      }


      image = String(image).trim();


      if (!image) {
        return "";
      }


      /*
         CLOUDINARY / REMOTE IMAGE
  
         Examples:
  
         https://res.cloudinary.com/...
         http://...
         //res.cloudinary.com/...
      */

      if (
        image.startsWith("https://") ||
        image.startsWith("http://") ||
        image.startsWith("//")
      ) {

        return image;

      }


      /*
         If the backend accidentally stored
         "url: https://..."
      */

      if (
        image.includes("res.cloudinary.com")
      ) {

        const httpsIndex =
          image.indexOf("https://");

        if (httpsIndex !== -1) {

          return image.substring(
            httpsIndex
          );

        }

      }


      /*
         OLD LOCAL UPLOAD SUPPORT
  
         This only works for old files that
         actually exist inside /public/uploads.
      */

      return "/uploads/" +
        encodeURIComponent(image);

    }


    /* ============================================================
       ESCAPE HTML
       ============================================================ */

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function escapeJs(value) {

      return String(value ?? "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"')
        .replace(/\r?\n/g, " ");

    }


    /* ============================================================
       NAVBAR ACTIVE
       ============================================================ */

    function setActiveNav() {

      document
        .querySelectorAll(".nav-links a")
        .forEach(link => {

          link.classList.remove("active");

        });


      byId("navMy")?.classList.add("active");

    }


    /* ============================================================
       LOAD DATA
       ============================================================ */

    async function loadItems() {

      try {

        const [
          userResponse,
          itemsResponse
        ] = await Promise.all([

          fetch("/api/user", {
            credentials: "include"
          }),

          fetch("/api/my-items", {
            credentials: "include",
            cache: "no-store"
          })

        ]);


        if (!userResponse.ok) {

          throw new Error(
            "Unable to load user information"
          );

        }


        if (!itemsResponse.ok) {

          if (itemsResponse.status === 401) {

            window.location.href =
              "/login.html";

            return;

          }

          throw new Error(
            "Unable to load your items"
          );

        }


        const user =
          await userResponse.json();


        const items =
          await itemsResponse.json();


        if (!Array.isArray(items)) {

          console.error(
            "Unexpected /api/my-items response:",
            items
          );

          throw new Error(
            "Invalid items data received from server"
          );

        }


        currentRole =
          user.role || "user";


        allItems = items;


        setupRole();


        populateTypeFilter();


        updateStats();


        applyFilters();


      } catch (error) {

        console.error(
          "My Items loading error:",
          error
        );


        byId("tableBody").innerHTML = `

            <tr>

                <td
                    colspan="8"
                    style="
                        padding:50px;
                        text-align:center;
                        color:#e74c3c;
                    "
                >

                    <div style="font-size:35px;">
                        ⚠️
                    </div>

                    <div style="
                        margin-top:10px;
                        font-weight:600;
                    ">
                        Failed to load your items
                    </div>

                    <div style="
                        margin-top:6px;
                        color:#6b7280;
                        font-size:12px;
                    ">
                        ${escapeHtml(error.message)}
                    </div>

                </td>

            </tr>

        `;

      }

    }


    /* ============================================================
       ROLE
       ============================================================ */

    function setupRole() {

      const badge =
        byId("roleBadge");

      const roleText =
        byId("roleBadgeText");


      if (!badge || !roleText) {
        return;
      }


      badge.className =
        "role-badge " +
        currentRole;


      if (currentRole === "admin") {

        roleText.textContent =
          "Admin";

      }

      else if (currentRole === "manager") {

        roleText.textContent =
          "Manager";

      }

      else {

        roleText.textContent =
          "Student / Staff";

      }


      const managerLink =
        byId("managerNavLink");


      if (
        managerLink &&
        (
          currentRole === "admin" ||
          currentRole === "manager"
        )
      ) {

        managerLink.style.display =
          "inline-block";

      }


      const notice =
        byId("noticeBox");


      if (
        currentRole === "admin" ||
        currentRole === "manager"
      ) {

        notice.innerHTML = `

            <div class="policy-notice">

                <span>🔒</span>

                <div class="policy-notice-text">

                    <strong>
                        ${currentRole === "admin"
            ? "Admin"
            : "Manager"} View:
                    </strong>

                    You are viewing administrative
                    item information.

                </div>

            </div>

        `;

      }

      else {

        notice.innerHTML = `

            <div class="info-notice">

                <span>ℹ️</span>

                <div class="info-notice-text">

                    <strong>
                        My Items:
                    </strong>

                    These are the lost and found
                    reports submitted using your account.

                </div>

            </div>

        `;

      }

    }


    /* ============================================================
       TYPE FILTER
       ============================================================ */

    function populateTypeFilter() {

      const select =
        byId("fType");


      select.innerHTML = `
        <option value="">
            All Types
        </option>
    `;


      const types = [
        ...new Set(
          allItems
            .map(item => item.type)
            .filter(Boolean)
        )
      ];


      types.sort();


      types.forEach(type => {

        const option =
          document.createElement("option");

        option.value = type;

        option.textContent = type;

        select.appendChild(option);

      });

    }


    /* ============================================================
       FILTERS
       ============================================================ */

    function getFilters() {

      return {

        search:
          byId("fSearch")
            .value
            .trim()
            .toLowerCase(),

        type:
          byId("fType").value,

        report:
          byId("fReport").value,

        collect:
          byId("fCollect").value,

        dateFrom:
          byId("fDateFrom").value,

        dateTo:
          byId("fDateTo").value

      };

    }


    function applyFilters() {

      const filters =
        getFilters();


      filteredItems =
        allItems.filter(item => {


          const text = [

            item.name,

            item.description,

            item.type,

            item.location,

            item.lostLocation,

            item.foundLocation

          ]

            .map(value =>
              String(value || "")
                .toLowerCase()
            )

            .join(" ");


          if (
            filters.search &&
            !text.includes(
              filters.search
            )
          ) {

            return false;

          }


          if (
            filters.type &&
            item.type !==
            filters.type
          ) {

            return false;

          }


          if (
            filters.report === "lost" &&
            !isLost(item)
          ) {

            return false;

          }


          if (
            filters.report === "found" &&
            isLost(item)
          ) {

            return false;

          }


          if (
            filters.collect === "pending" &&
            isCollected(item)
          ) {

            return false;

          }


          if (
            filters.collect === "collected" &&
            !isCollected(item)
          ) {

            return false;

          }


          const date =
            getDate(item);


          if (
            filters.dateFrom &&
            date &&
            date < filters.dateFrom
          ) {

            return false;

          }


          if (
            filters.dateTo &&
            date &&
            date > filters.dateTo
          ) {

            return false;

          }


          return true;

        });


      updateFilterPills(
        filters
      );


      renderTable();

    }


    /* ============================================================
       FILTER PILLS
       ============================================================ */

    function updateFilterPills(filters) {

      const container =
        byId("activePills");


      container.innerHTML = "";


      function addPill(
        id,
        text
      ) {

        const pill =
          document.createElement(
            "span"
          );


        pill.className =
          "filter-pill";


        pill.innerHTML = `

            ${escapeHtml(text)}

            <button
                onclick="clearFilter('${id}')"
            >
                ✕
            </button>

        `;


        container.appendChild(pill);

      }


      if (filters.search) {

        addPill(
          "fSearch",
          `"${filters.search}"`
        );

      }


      if (filters.type) {

        addPill(
          "fType",
          filters.type
        );

      }


      if (filters.report) {

        addPill(
          "fReport",
          filters.report
        );

      }


      if (filters.collect) {

        addPill(
          "fCollect",
          filters.collect
        );

      }


      if (filters.dateFrom) {

        addPill(
          "fDateFrom",
          "From: " +
          filters.dateFrom
        );

      }


      if (filters.dateTo) {

        addPill(
          "fDateTo",
          "To: " +
          filters.dateTo
        );

      }

    }


    function clearFilter(id) {

      const element =
        byId(id);


      if (
        element.tagName ===
        "SELECT"
      ) {

        element.selectedIndex =
          0;

      }

      else {

        element.value = "";

      }


      applyFilters();

    }


    /* ============================================================
       STATS
       ============================================================ */

    function updateStats() {

      const total =
        allItems.length;


      const lost =
        allItems.filter(
          item => isLost(item)
        ).length;


      const found =
        allItems.filter(
          item => !isLost(item)
        ).length;


      const collected =
        allItems.filter(
          item => isCollected(item)
        ).length;


      const pending =
        total - collected;


      byId("statTotal")
        .textContent = total;


      byId("statLost")
        .textContent = lost;


      byId("statFound")
        .textContent = found;


      byId("statPending")
        .textContent = pending;


      byId("statCollected")
        .textContent = collected;


      byId("tc-all")
        .textContent = total;


      byId("tc-lost")
        .textContent = lost;


      byId("tc-found")
        .textContent = found;


      byId("tc-pending")
        .textContent = pending;


      byId("tc-collected")
        .textContent = collected;

    }


    /* ============================================================
       SORT
       ============================================================ */

    function sortBy(column) {

      if (
        sortColumn === column
      ) {

        sortDirection *= -1;

      }

      else {

        sortColumn =
          column;

        sortDirection =
          1;

      }


      renderTable();

    }


    function sortedItems(items) {

      if (!sortColumn) {

        return items;

      }


      return [...items].sort(
        (a, b) => {

          let va = "";
          let vb = "";


          if (
            sortColumn === "name"
          ) {

            va =
              a.name || "";

            vb =
              b.name || "";

          }


          else if (
            sortColumn === "type"
          ) {

            va =
              a.type || "";

            vb =
              b.type || "";

          }


          else if (
            sortColumn === "date"
          ) {

            va =
              getDate(a);

            vb =
              getDate(b);

          }


          else if (
            sortColumn === "status"
          ) {

            va =
              isCollected(a)
                ? "collected"
                : "pending";

            vb =
              isCollected(b)
                ? "collected"
                : "pending";

          }


          return (
            va.localeCompare(
              vb
            ) *
            sortDirection
          );

        }
      );

    }


    /* ============================================================
       TABLE HEADER
       ============================================================ */

    function buildHeader() {

      byId("tableHead").innerHTML = `

        <th onclick="sortBy('name')">
            Item Name ↕
        </th>

        <th onclick="sortBy('type')">
            Type ↕
        </th>

        <th>
            Description
        </th>

        <th>
            Location
        </th>

        <th onclick="sortBy('date')">
            Date ↕
        </th>

        <th>
            Report Type
        </th>

        <th onclick="sortBy('status')">
            Status ↕
        </th>

        <th>
            Image
        </th>

    `;

    }


    /* ============================================================
       BUILD IMAGE
       ============================================================ */

    function buildImage(item) {

      const imageUrl =
        getImageUrl(item);


      if (!imageUrl) {

        return `
            <div
                class="no-img"
                title="No image uploaded"
            >
                📷
            </div>
        `;

      }


      const safeUrl =
        escapeHtml(imageUrl);


      const name =
        escapeHtml(
          safe(item.name)
        );


      const description =
        escapeHtml(
          safe(item.description)
        );


      /*
         IMPORTANT:
  
         We use the Cloudinary URL directly.
  
         We DO NOT prepend /uploads/
         when it is already a Cloudinary URL.
      */

      return `

        <img

            class="table-img"

            src="${safeUrl}"

            alt="${name}"

            loading="lazy"

            referrerpolicy="no-referrer"

            onerror="imageLoadError(this)"

            onclick="
                event.stopPropagation();

                openImageModal(
                    '${escapeJs(imageUrl)}',
                    '${escapeJs(safe(item.name))}',
                    '${escapeJs(safe(item.description))}'
                );
            "

        >

    `;

    }


    /* ============================================================
       IMAGE ERROR HANDLER
       ============================================================ */

    function imageLoadError(img) {

      console.error(
        "IMAGE FAILED TO LOAD:",
        img.src
      );


      /*
         Do not keep showing the browser's
         broken-image icon.
  
         Replace it with a clean placeholder.
      */

      const placeholder =
        document.createElement(
          "div"
        );


      placeholder.className =
        "no-img";


      placeholder.innerHTML =
        "📷";


      placeholder.title =
        "Image could not be loaded";


      img.replaceWith(
        placeholder
      );

    }


    /* ============================================================
       BUILD ROW
       ============================================================ */

    function buildRow(item, index) {

      const lost =
        isLost(item);


      const collected =
        isCollected(item);


      const date =
        safe(getDate(item));


      const location =
        safe(
          item.lostLocation ||
          item.foundLocation
        );


      const reportBadge =
        lost

          ? `
            <span class="badge badge-lost">
                ● Lost
            </span>
        `

          : `
            <span class="badge badge-found">
                ● Found
            </span>
        `;


      const statusBadge =
        collected

          ? `
            <span class="badge badge-collected">
                ✓ Collected
            </span>
        `

          : `
            <span class="badge badge-pending">
                ⏳ Pending
            </span>
        `;


      const image =
        buildImage(item);


      const rowId =
        "row-" + index;


      const detailId =
        "detail-" + index;


      return `

        <tr
            id="${rowId}"
            onclick="toggleRow(${index})"
            style="cursor:pointer;"
        >

            <td>
                <strong>
                    ${escapeHtml(
        safe(item.name)
      )}
                </strong>
            </td>


            <td>
                ${escapeHtml(
        safe(item.type)
      )}
            </td>


            <td
                style="
                    max-width:220px;
                    text-align:left;
                    white-space:normal;
                    color:#6b7280;
                    font-size:12px;
                "
            >
                ${escapeHtml(
        safe(item.description)
      )}
            </td>


            <td>
                ${escapeHtml(location)}
            </td>


            <td>
                ${escapeHtml(date)}
            </td>


            <td>
                ${reportBadge}
            </td>


            <td>
                ${statusBadge}
            </td>


            <td class="image-cell">
                ${image}
            </td>

        </tr>


        <tr
            class="detail-row"
            id="${detailId}"
        >

            <td colspan="8">

                <div class="detail-grid">

                    <div class="detail-field">

                        <label>
                            Item Name
                        </label>

                        <span>
                            ${escapeHtml(
        safe(item.name)
      )}
                        </span>

                    </div>


                    <div class="detail-field">

                        <label>
                            Type
                        </label>

                        <span>
                            ${escapeHtml(
        safe(item.type)
      )}
                        </span>

                    </div>


                    <div class="detail-field">

                        <label>
                            Report Type
                        </label>

                        <span>
                            ${lost
          ? "Lost"
          : "Found"}
                        </span>

                    </div>


                    <div class="detail-field">

                        <label>
                            Status
                        </label>

                        <span>
                            ${collected
          ? "Collected"
          : "Pending"}
                        </span>

                    </div>


                    <div class="detail-field">

                        <label>
                            Date
                        </label>

                        <span>
                            ${escapeHtml(date)}
                        </span>

                    </div>


                    <div class="detail-field">

                        <label>
                            Location
                        </label>

                        <span>
                            ${escapeHtml(location)}
                        </span>

                    </div>


                    <div
                        class="detail-field"
                        style="grid-column:1/-1;"
                    >

                        <label>
                            Description
                        </label>

                        <span
                            style="white-space:pre-wrap;"
                        >
                            ${escapeHtml(
            safe(item.description)
          )}
                        </span>

                    </div>


                    <div class="detail-field">

                        <label>
                            Submit Location
                        </label>

                        <span>
                            ${escapeHtml(
            safe(item.location)
          )}
                        </span>

                    </div>


                    <div class="detail-field">

                        <label>
                            Contact
                        </label>

                        <span>
                            ${escapeHtml(
            safe(item.contact)
          )}
                        </span>

                    </div>

                </div>

            </td>

        </tr>

    `;

    }


    /* ============================================================
       RENDER TABLE
       ============================================================ */

    function renderTable() {

      buildHeader();


      let data =
        sortedItems(
          filteredItems
        );


      if (
        currentTab === "lost"
      ) {

        data =
          data.filter(
            item => isLost(item)
          );

      }


      else if (
        currentTab === "found"
      ) {

        data =
          data.filter(
            item => !isLost(item)
          );

      }


      else if (
        currentTab === "pending"
      ) {

        data =
          data.filter(
            item => !isCollected(item)
          );

      }


      else if (
        currentTab === "collected"
      ) {

        data =
          data.filter(
            item => isCollected(item)
          );

      }


      byId("itemCount")
        .textContent = data.length;


      if (!data.length) {

        byId("tableBody").innerHTML = `

            <tr>

                <td
                    colspan="8"
                >

                    <div
                        class="empty-state"
                    >

                        <div
                            class="empty-state-icon"
                        >
                            🔍
                        </div>

                        <div>
                            No items found.
                        </div>

                    </div>

                </td>

            </tr>

        `;

        return;

      }


      byId("tableBody").innerHTML =
        data
          .map(
            (item, index) =>
              buildRow(
                item,
                index
              )
          )
          .join("");

    }


    /* ============================================================
       TABS
       ============================================================ */

    function setTab(tab) {

      currentTab =
        tab;


      document
        .querySelectorAll(".tab-btn")
        .forEach(button => {

          button.className =
            "tab-btn";

        });


      const button =
        byId(
          "tab" +
          tab.charAt(0).toUpperCase() +
          tab.slice(1)
        );


      if (button) {

        button.classList.add(
          "active-" + tab
        );

      }


      renderTable();

    }


    /* ============================================================
       ROW EXPAND
       ============================================================ */

    function toggleRow(index) {

      const row =
        byId(
          "detail-" + index
        );


      if (!row) {
        return;
      }


      const alreadyOpen =
        row.classList.contains(
          "open"
        );


      document
        .querySelectorAll(
          ".detail-row"
        )
        .forEach(element => {

          element.classList.remove(
            "open"
          );

        });


      if (!alreadyOpen) {

        row.classList.add(
          "open"
        );

        expandedRow =
          index;

      }

      else {

        expandedRow =
          null;

      }

    }


    /* ============================================================
       IMAGE MODAL
       ============================================================ */

    function openImageModal(
      src,
      name,
      description
    ) {

      byId("modalImage").src =
        src;


      byId("modalImage").onerror =
        function () {

          this.onerror = null;

          this.src =
            "";

          this.alt =
            "Image could not be loaded";

        };


      byId("modalName")
        .textContent =
        name;


      byId("modalDescription")
        .textContent =
        description;


      byId("imgModal")
        .classList.add("open");


      document.body.style.overflow =
        "hidden";

    }


    function closeImageModal(event) {

      if (
        !event ||
        event.target ===
        byId("imgModal")
      ) {

        byId("imgModal")
          .classList.remove(
            "open"
          );


        document.body.style.overflow =
          "";

      }

    }


    /* ============================================================
       FILTER EVENTS
       ============================================================ */

    byId("btnReset")
      .addEventListener(
        "click",
        function () {

          [
            "fSearch",
            "fType",
            "fReport",
            "fCollect",
            "fDateFrom",
            "fDateTo"
          ]
            .forEach(id => {

              const element =
                byId(id);


              if (
                element.tagName ===
                "SELECT"
              ) {

                element.selectedIndex =
                  0;

              }

              else {

                element.value =
                  "";

              }

            });


          applyFilters();

        }
      );


    [
      "fSearch",
      "fType",
      "fReport",
      "fCollect",
      "fDateFrom",
      "fDateTo"
    ]
      .forEach(id => {

        const element =
          byId(id);


        element.addEventListener(
          "input",
          applyFilters
        );


        element.addEventListener(
          "change",
          applyFilters
        );

      });


    /* ============================================================
       KEYBOARD
       ============================================================ */

    document.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key ===
          "Escape"
        ) {

          closeImageModal();

        }

      }
    );


    /* ============================================================
       START
       ============================================================ */

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        setActiveNav();

        loadItems();

      }
    );

  </script>


  <script src="/js/navbar.js"></script>

  <script src="/js/translate.js"></script>

  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
